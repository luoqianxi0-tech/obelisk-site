<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>OBELISK | Motion Lab</title>
<script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-auth-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--glass:rgba(255,255,255,0.03);--glass-border:rgba(255,255,255,0.08);--accent:rgba(100,255,150,0.6);--accent2:rgba(80,180,255,0.6);--danger:rgba(255,80,80,0.6)}
html,body{background:#000;color:#e0e0e5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px}

/* Auth Loading */
.auth-overlay{position:fixed;inset:0;background:#000;z-index:99999;display:flex;align-items:center;justify-content:center;transition:opacity 0.5s ease,visibility 0.5s ease}
.auth-overlay.done{opacity:0;visibility:hidden;pointer-events:none}
.auth-overlay .spinner{width:36px;height:36px;border:1px solid rgba(255,255,255,0.1);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.top-bar{position:relative;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:20px 40px;backdrop-filter:blur(10px)}
.logo{font-size:0.9rem;letter-spacing:0.3em;font-weight:300;color:rgba(255,255,255,0.7);cursor:pointer;text-decoration:none}
.logo:hover{color:#fff}
.icon-btn{width:36px;height:36px;border:1px solid var(--glass-border);background:var(--glass);color:rgba(255,255,255,0.4);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.3s;font-size:1rem}
.icon-btn:hover{border-color:rgba(255,255,255,0.3);color:#fff}
.container{max-width:900px;margin:0 auto;padding:0 24px 60px;position:relative;z-index:5}
h1{font-size:1.4rem;font-weight:300;letter-spacing:0.15em;margin-bottom:8px;background:linear-gradient(180deg,#fff,rgba(255,255,255,0.5));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{font-size:0.75rem;color:rgba(255,255,255,0.3);letter-spacing:0.1em;margin-bottom:32px}
.viz-card{background:var(--glass);border:1px solid var(--glass-border);padding:24px;margin-bottom:24px;backdrop-filter:blur(10px);transition:border-color 0.3s}
.viz-card:hover{border-color:rgba(255,255,255,0.15)}
.viz-title{font-size:0.75rem;color:rgba(255,255,255,0.4);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:16px}
.viz-canvas{width:100%;height:300px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.05)}
.tree-node{padding:8px 12px;margin:2px 0;background:rgba(255,255,255,0.03);border-left:2px solid var(--accent);font-size:0.75rem;font-family:'Courier New',monospace;color:rgba(255,255,255,0.6);transition:all 0.3s;cursor:pointer}
.tree-node:hover{background:rgba(255,255,255,0.06);color:#fff;border-left-color:var(--accent2)}
.tree-children{padding-left:20px;border-left:1px solid rgba(255,255,255,0.05);margin-left:4px}
.viz-stats{display:flex;gap:24px;margin-top:12px;font-size:0.7rem;color:rgba(255,255,255,0.4);font-family:'Courier New',monospace}
.viz-stat{display:flex;align-items:center;gap:6px}
.viz-stat-val{color:var(--accent)}
.no-data{text-align:center;padding:40px;color:rgba(255,255,255,0.2);font-size:0.8rem}
.hint-link{color:var(--accent2);cursor:pointer;text-decoration:underline}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.7);padding:10px 24px;font-size:0.75rem;letter-spacing:0.1em;backdrop-filter:blur(10px);z-index:99999;transition:opacity 0.5s;white-space:nowrap}
@media(max-width:768px){.top-bar{padding:16px 20px}.viz-canvas{height:200px}}
</style>
</head>
<body>
<div class="auth-overlay" id="authOverlay"><div class="spinner"></div></div>
<div class="top-bar">
<a class="logo" href="./index.html">&#8592; OBELISK</a>
<button class="icon-btn" onclick="toggleLang()">&#127760;</button>
</div>
<div class="container">
<h1 data-i18n="title">Motion Lab</h1>
<div class="subtitle" data-i18n="subtitle">APK Structure Visualizer & Network Topology</div>
<div class="viz-card">
<div class="viz-title" data-i18n="tree_title">APK File Structure</div>
<div id="treeContainer"></div>
<div class="viz-stats" id="treeStats"></div>
</div>
<div class="viz-card">
<div class="viz-title" data-i18n="perm_title">Permission Relationship Graph</div>
<canvas class="viz-canvas" id="permCanvas"></canvas>
<div class="viz-stats" id="permStats"></div>
</div>
<div class="viz-card">
<div class="viz-title" data-i18n="net_title">Network Traffic Topology</div>
<canvas class="viz-canvas" id="netCanvas"></canvas>
<div class="viz-stats" id="netStats"></div>
</div>
</div>
<script>
const ADMIN_UIDS=['nCZLU2r9YfXVTrQ79EJqWJxPPT03'];
const i18n={
en:{title:"Motion Lab",subtitle:"APK Structure Visualizer & Network Topology",tree_title:"APK File Structure",perm_title:"Permission Relationship Graph",net_title:"Network Traffic Topology",no_data:"No APK data. Upload in Reverse Notes to visualize.",no_data_link:"Go to Reverse Notes",files:"files",perms:"perms",libs:"libs",nodes:"nodes",conns:"connections",strings:"strings"},
zh:{title:"动效实验室",subtitle:"APK 结构可视化与网络拓扑",tree_title:"APK 文件结构",perm_title:"权限关系图",net_title:"网络流量拓扑",no_data:"没有 APK 数据。在逆向手记中上传以可视化。",no_data_link:"前往逆向手记",files:"文件",perms:"权限",libs:"库",nodes:"节点",conns:"连接",strings:"字符串"}
};
let currentLang=localStorage.getItem('obelisk_lang')||'en';
let authReady=false;
function applyLang(){const t=i18n[currentLang];document.querySelectorAll('[data-i18n]').forEach(function(el){const key=el.getAttribute('data-i18n');if(t[key])el.textContent=t[key];});}
function toggleLang(){currentLang=currentLang==='en'?'zh':'en';localStorage.setItem('obelisk_lang',currentLang);applyLang();location.reload();}
function hideAuthOverlay(){const o=document.getElementById('authOverlay');if(o){o.classList.add('done');setTimeout(function(){o.remove();},600);}}

const firebaseConfig={apiKey:"AIzaSyAlvwV6tQMdLGAYnGZsMxwIW5B8cYdiKNY",authDomain:"obelisk-ca117.firebaseapp.com",projectId:"obelisk-ca117",storageBucket:"obelisk-ca117.firebasestorage.app",messagingSenderId:"574365252836",appId:"1:574365252836:web:f8c21cc4cb1bdcd46480f1",measurementId:"G-D0P8QL36G8"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

auth.onAuthStateChanged(function(user){
  authReady=true;
  hideAuthOverlay();
});

const lastAPK=JSON.parse(sessionStorage.getItem('obelisk_last_apk')||'{}');
const t=i18n[currentLang];

function showToast(msg){const existing=document.querySelector('.toast');if(existing)existing.remove();const toast=document.createElement('div');toast.className='toast';toast.textContent=msg;document.body.appendChild(toast);setTimeout(function(){toast.style.opacity='0';},2500);setTimeout(function(){toast.remove();},3000);}
function escapeHtml(text){return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

const treeContainer=document.getElementById('treeContainer');
if(lastAPK&&lastAPK.filename){
const permCount=(lastAPK.manifest&&lastAPK.manifest.permissions)?lastAPK.manifest.permissions.length:0;
const libCount=(lastAPK.nativeLibs)?lastAPK.nativeLibs.length:0;
const strCount=(lastAPK.dexStrings)?lastAPK.dexStrings.length:0;
treeContainer.innerHTML='<div class="tree-node" style="border-left-color:var(--accent2)">'+escapeHtml(lastAPK.filename)+'</div><div class="tree-children"><div class="tree-node">AndroidManifest.xml</div><div class="tree-node">classes.dex</div><div class="tree-node">lib/ ('+libCount+' .so)</div><div class="tree-children">'+(lastAPK.nativeLibs||[]).map(function(l){return'<div class="tree-node">'+escapeHtml(l.split('/').pop())+'</div>';}).join('')+'</div><div class="tree-node">res/ (resources)</div><div class="tree-node">META-INF/ (signatures)</div><div class="tree-node">assets/ (raw assets)</div></div>';
document.getElementById('treeStats').innerHTML='<div class="viz-stat"><span class="viz-stat-val">'+permCount+'</span> '+t.perms+'</div><div class="viz-stat"><span class="viz-stat-val">'+libCount+'</span> '+t.libs+'</div><div class="viz-stat"><span class="viz-stat-val">'+strCount+'</span> '+t.strings+'</div>';
}else{
treeContainer.innerHTML='<div class="no-data">'+t.no_data+'<br><span class="hint-link" onclick="window.location.href='./reverse.html'">'+t.no_data_link+'</span></div>';
document.getElementById('treeStats').innerHTML='';
}

(function(){
const canvas=document.getElementById('permCanvas');const ctx=canvas.getContext('2d');canvas.width=canvas.offsetWidth;canvas.height=canvas.offsetHeight;
const perms=(lastAPK&&lastAPK.manifest)?(lastAPK.manifest.permissions||[]):[];
const centerX=canvas.width/2,centerY=canvas.height/2,radius=Math.min(canvas.width,canvas.height)*0.35;
if(perms.length===0){ctx.fillStyle='rgba(255,255,255,0.2)';ctx.font='0.8rem sans-serif';ctx.textAlign='center';ctx.fillText(t.no_data,centerX,centerY);return;}
const nodes=[];perms.forEach(function(p,i){const angle=(i/perms.length)*Math.PI*2-Math.PI/2;nodes.push({x:centerX+Math.cos(angle)*radius,y:centerY+Math.sin(angle)*radius,label:p.replace('android.permission.',''),angle:angle});});
document.getElementById('permStats').innerHTML='<div class="viz-stat"><span class="viz-stat-val">'+perms.length+'</span> '+t.perms+'</div><div class="viz-stat"><span class="viz-stat-val">'+nodes.length+'</span> '+t.nodes+'</div>';
let frame=0;var lastTime=0;
function draw(timestamp){if(timestamp-lastTime<33){requestAnimationFrame(draw);return;}lastTime=timestamp;frame++;ctx.clearRect(0,0,canvas.width,canvas.height);
nodes.forEach(function(n){const pulse=Math.sin(frame*0.05)*0.3+0.7;ctx.beginPath();ctx.moveTo(centerX,centerY);ctx.lineTo(n.x,n.y);ctx.strokeStyle='rgba(100,255,150,'+(0.1*pulse)+')';ctx.lineWidth=1;ctx.stroke();});
ctx.beginPath();ctx.arc(centerX,centerY,8+Math.sin(frame*0.05)*2,0,Math.PI*2);ctx.fillStyle='var(--accent)';ctx.fill();ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='0.65rem monospace';ctx.textAlign='center';ctx.fillText('APK',centerX,centerY+20);
nodes.forEach(function(n){ctx.beginPath();ctx.arc(n.x,n.y,5,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,0.6)';ctx.fill();ctx.fillStyle='rgba(255,255,255,0.7)';ctx.font='0.6rem monospace';ctx.textAlign='center';const labelX=n.x+Math.cos(n.angle)*20;const labelY=n.y+Math.sin(n.angle)*20;ctx.fillText(n.label,labelX,labelY);});requestAnimationFrame(draw);}requestAnimationFrame(draw);
})();

(function(){
const canvas=document.getElementById('netCanvas');const ctx=canvas.getContext('2d');canvas.width=canvas.offsetWidth;canvas.height=canvas.offsetHeight;
const hasData=lastAPK&&lastAPK.filename;
const nodes=[{x:canvas.width*0.5,y:canvas.height*0.5,label:'APK',r:8,vx:0,vy:0},{x:canvas.width*0.2,y:canvas.height*0.3,label:'C2',r:5,vx:0.2,vy:0.1},{x:canvas.width*0.8,y:canvas.height*0.3,label:'API',r:5,vx:-0.15,vy:0.2},{x:canvas.width*0.3,y:canvas.height*0.7,label:'ADS',r:5,vx:0.1,vy:-0.2},{x:canvas.width*0.7,y:canvas.height*0.7,label:'CDN',r:5,vx:-0.2,vy:-0.1}];
if(hasData&&lastAPK.suspicious&&lastAPK.suspicious.length>0){nodes.push({x:canvas.width*0.5,y:canvas.height*0.2,label:'SUSPICIOUS',r:6,vx:0.1,vy:0.15});}
document.getElementById('netStats').innerHTML='<div class="viz-stat"><span class="viz-stat-val">'+nodes.length+'</span> '+t.nodes+'</div><div class="viz-stat"><span class="viz-stat-val">'+(nodes.length-1)*2+'</span> '+t.conns+'</div>';
let frame=0;var lastTime=0;
function draw(timestamp){if(timestamp-lastTime<33){requestAnimationFrame(draw);return;}lastTime=timestamp;frame++;ctx.clearRect(0,0,canvas.width,canvas.height);
if(!hasData){ctx.fillStyle='rgba(255,255,255,0.2)';ctx.font='0.8rem sans-serif';ctx.textAlign='center';ctx.fillText(t.no_data,canvas.width/2,canvas.height/2);requestAnimationFrame(draw);return;}
nodes.forEach(function(n,i){if(i===0)return;n.x+=n.vx;n.y+=n.vy;if(n.x<30||n.x>canvas.width-30)n.vx*=-1;if(n.y<30||n.y>canvas.height-30)n.vy*=-1;});
for(let i=1;i<nodes.length;i++){ctx.beginPath();ctx.moveTo(nodes[0].x,nodes[0].y);ctx.lineTo(nodes[i].x,nodes[i].y);ctx.strokeStyle='rgba(80,180,255,0.1)';ctx.stroke();const t=(frame*0.01+i*0.2)%1;const px=nodes[0].x+(nodes[i].x-nodes[0].x)*t;const py=nodes[0].y+(nodes[i].y-nodes[0].y)*t;ctx.beginPath();ctx.arc(px,py,2,0,Math.PI*2);ctx.fillStyle='rgba(80,180,255,0.6)';ctx.fill();}
nodes.forEach(function(n){ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,Math.PI*2);ctx.fillStyle=n.label==='APK'?'var(--accent)':(n.label==='SUSPICIOUS'?'var(--danger)':'rgba(80,180,255,0.6)');ctx.fill();ctx.fillStyle='rgba(255,255,255,0.7)';ctx.font='0.65rem monospace';ctx.textAlign='center';ctx.fillText(n.label,n.x,n.y-12);});requestAnimationFrame(draw);}requestAnimationFrame(draw);
})();

applyLang();
</script>
</body>
</html>
