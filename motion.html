<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>OBELISK | Motion Lab</title>
<script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-auth-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--glass:rgba(255,255,255,0.03);--glass-border:rgba(255,255,255,0.08);--accent:rgba(100,255,150,0.6);--accent2:rgba(80,180,255,0.6);--danger:rgba(255,80,80,0.6);--warn:rgba(255,200,80,0.7)}
html,body{background:#000;color:#e0e0e5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px}

.auth-overlay{position:fixed;inset:0;background:#000;z-index:99999;display:flex;align-items:center;justify-content:center;transition:opacity 0.5s ease,visibility 0.5s ease}
.auth-overlay.done{opacity:0;visibility:hidden;pointer-events:none}
.auth-overlay .spinner{width:36px;height:36px;border:1px solid rgba(255,255,255,0.1);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

#bgCanvas{position:fixed;inset:0;z-index:0;pointer-events:none}
.top-bar{position:relative;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:20px 40px;backdrop-filter:blur(10px)}
.logo{font-size:0.9rem;letter-spacing:0.3em;font-weight:300;color:rgba(255,255,255,0.7);cursor:pointer;text-decoration:none}
.logo:hover{color:#fff}
.icon-btn{width:36px;height:36px;border:1px solid var(--glass-border);background:var(--glass);color:rgba(255,255,255,0.4);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.3s;font-size:1rem}
.icon-btn:hover{border-color:rgba(255,255,255,0.3);color:#fff}
.container{max-width:900px;margin:0 auto;padding:0 24px 60px;position:relative;z-index:5}
h1{font-size:1.4rem;font-weight:300;letter-spacing:0.15em;margin-bottom:8px;background:linear-gradient(180deg,#fff,rgba(255,255,255,0.5));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{font-size:0.75rem;color:rgba(255,255,255,0.3);letter-spacing:0.1em;margin-bottom:32px}

.demo-section{margin-bottom:40px}
.demo-title{font-size:0.8rem;color:rgba(255,255,255,0.5);letter-spacing:0.15em;text-transform:uppercase;margin-bottom:16px}
.demo-card{background:var(--glass);border:1px solid var(--glass-border);padding:24px;backdrop-filter:blur(10px)}
.demo-canvas{width:100%;height:300px;background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.05)}
.demo-controls{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap}
.demo-btn{padding:10px 20px;background:transparent;border:1px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.6);font-size:0.75rem;letter-spacing:0.1em;cursor:pointer;transition:all 0.3s;font-family:inherit}
.demo-btn:hover{border-color:rgba(255,255,255,0.3);color:#fff}
.demo-btn.active{border-color:var(--accent);color:var(--accent)}

.graph-section{margin-top:40px}
.graph-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.graph-card{background:var(--glass);border:1px solid var(--glass-border);padding:20px;backdrop-filter:blur(10px)}
.graph-title{font-size:0.7rem;color:rgba(255,255,255,0.4);letter-spacing:0.1em;margin-bottom:12px}
.graph-canvas{width:100%;height:150px}

.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.7);padding:10px 24px;font-size:0.75rem;letter-spacing:0.1em;backdrop-filter:blur(10px);z-index:99999;transition:opacity 0.5s;white-space:nowrap}
@media(max-width:768px){.graph-grid{grid-template-columns:1fr}.top-bar{padding:16px 20px}.demo-controls{flex-direction:column}.demo-btn{width:100%}}
</style>
</head>
<body>
<div class="auth-overlay" id="authOverlay"><div class="spinner"></div></div>
<canvas id="bgCanvas"></canvas>
<div class="top-bar">
<a class="logo" href="./index.html">&#8592; OBELISK</a>
<button class="icon-btn" onclick="toggleLang()" title="Language">&#127760;</button>
</div>
<div class="container">
<h1 data-i18n="title">Motion Lab</h1>
<div class="subtitle" data-i18n="subtitle">APK Structure Visualizer & Network Topology</div>

<div class="demo-section">
<div class="demo-title" data-i18n="demo_particles">Particle Network</div>
<div class="demo-card">
<canvas class="demo-canvas" id="particleDemo"></canvas>
<div class="demo-controls">
<button class="demo-btn active" onclick="setParticleMode('normal')" data-i18n="mode_normal">Normal</button>
<button class="demo-btn" onclick="setParticleMode('orbit')" data-i18n="mode_orbit">Orbit</button>
<button class="demo-btn" onclick="setParticleMode('wave')" data-i18n="mode_wave">Wave</button>
<button class="demo-btn" onclick="resetParticles()" data-i18n="btn_reset">Reset</button>
</div>
</div>
</div>

<div class="demo-section">
<div class="demo-title" data-i18n="demo_structure">APK Structure</div>
<div class="demo-card">
<canvas class="demo-canvas" id="structureDemo"></canvas>
<div class="demo-controls">
<button class="demo-btn active" onclick="setStructureView('tree')" data-i18n="view_tree">Tree View</button>
<button class="demo-btn" onclick="setStructureView('radial')" data-i18n="view_radial">Radial View</button>
</div>
</div>
</div>

<div class="graph-section">
<div class="demo-title" data-i18n="graph_section">Real-time Metrics</div>
<div class="graph-grid">
<div class="graph-card">
<div class="graph-title" data-i18n="graph_network">Network Flow</div>
<canvas class="graph-canvas" id="networkGraph"></canvas>
</div>
<div class="graph-card">
<div class="graph-title" data-i18n="graph_cpu">CPU Usage</div>
<canvas class="graph-canvas" id="cpuGraph"></canvas>
</div>
</div>
</div>
</div>

<script>
const firebaseConfig={apiKey:"AIzaSyAlvwV6tQMdLGAYnGZsMxwIW5B8cYdiKNY",authDomain:"obelisk-ca117.firebaseapp.com",projectId:"obelisk-ca117",storageBucket:"obelisk-ca117.firebasestorage.app",messagingSenderId:"574365252836",appId:"1:574365252836:web:f8c21cc4cb1bdcd46480f1",measurementId:"G-D0P8QL36G8"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();

var currentLang='en';
var particleMode='normal';
var structureView='tree';
const i18n={
  en:{title:"Motion Lab",subtitle:"APK Structure Visualizer & Network Topology",demo_particles:"Particle Network",demo_structure:"APK Structure",mode_normal:"Normal",mode_orbit:"Orbit",mode_wave:"Wave",btn_reset:"Reset",view_tree:"Tree View",view_radial:"Radial View",graph_section:"Real-time Metrics",graph_network:"Network Flow",graph_cpu:"CPU Usage"},
  zh:{title:"动效实验室",subtitle:"APK结构可视化与网络拓扑",demo_particles:"粒子网络",demo_structure:"APK结构",mode_normal:"正常",mode_orbit:"轨道",mode_wave:"波浪",btn_reset:"重置",view_tree:"树形视图",view_radial:"径向视图",graph_section:"实时指标",graph_network:"网络流量",graph_cpu:"CPU使用率"}
};

function toggleLang(){
  currentLang=currentLang==='en'?'zh':'en';
  document.querySelectorAll('[data-i18n]').forEach(function(el){
    const key=el.getAttribute('data-i18n');
    if(i18n[currentLang][key])el.textContent=i18n[currentLang][key];
  });
}

function setParticleMode(mode){
  particleMode=mode;
  document.querySelectorAll('.demo-section:first-of-type .demo-btn').forEach(function(btn){
    btn.classList.remove('active');
    if(btn.textContent.includes(mode==='normal'?'Normal':mode==='orbit'?'Orbit':'Wave'))btn.classList.add('active');
  });
}

function setStructureView(view){
  structureView=view;
  document.querySelectorAll('.demo-section:nth-of-type(2) .demo-btn').forEach(function(btn){
    btn.classList.remove('active');
    if(btn.textContent.includes(view==='tree'?'Tree':'Radial'))btn.classList.add('active');
  });
}

function resetParticles(){
  initParticleDemo();
}

auth.onAuthStateChanged(function(user){
  setTimeout(function(){
    var overlay=document.getElementById('authOverlay');
    if(overlay){overlay.classList.add('done');setTimeout(function(){overlay.remove();},600);}
  },800);
});

// Background particles
(function(){
  const canvas=document.getElementById('bgCanvas');
  const ctx=canvas.getContext('2d');
  let w,h,nodes=[];
  function resize(){w=canvas.width=window.innerWidth;h=canvas.height=window.innerHeight;}
  resize();
  window.addEventListener('resize',resize);
  for(let i=0;i<30;i++){
    nodes.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-0.5)*0.2,vy:(Math.random()-0.5)*0.2,r:Math.random()*1.5+0.5});
  }
  function draw(){
    ctx.clearRect(0,0,w,h);
    for(var i=0;i<nodes.length;i++){
      var n=nodes[i];
      n.x+=n.vx;n.y+=n.vy;
      if(n.x<0)n.x=w;if(n.x>w)n.x=0;
      if(n.y<0)n.y=h;if(n.y>h)n.y=0;
      ctx.beginPath();
      ctx.arc(n.x,n.y,n.r,0,Math.PI*2);
      ctx.fillStyle='rgba(255,255,255,0.15)';
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  draw();
})();

// Particle demo
var particleNodes=[];
function initParticleDemo(){
  var canvas=document.getElementById('particleDemo');
  var ctx=canvas.getContext('2d');
  canvas.width=canvas.offsetWidth;
  canvas.height=300;
  var w=canvas.width,h=canvas.height;
  particleNodes=[];
  for(let i=0;i<50;i++){
    particleNodes.push({
      x:Math.random()*w,
      y:Math.random()*h,
      vx:(Math.random()-0.5)*2,
      vy:(Math.random()-0.5)*2,
      r:Math.random()*3+1,
      angle:Math.random()*Math.PI*2,
      orbitR:Math.random()*50+30
    });
  }
  function drawParticleDemo(){
    ctx.clearRect(0,0,w,h);
    var centerX=w/2,centerY=h/2;
    for(var i=0;i<particleNodes.length;i++){
      var n=particleNodes[i];
      if(particleMode==='orbit'){
        n.angle+=0.02;
        n.x=centerX+Math.cos(n.angle)*n.orbitR;
        n.y=centerY+Math.sin(n.angle)*n.orbitR;
      }else if(particleMode==='wave'){
        n.x+=n.vx;
        n.y=centerY+Math.sin(n.x*0.02+i)*50;
        if(n.x<0||n.x>w)n.vx*=-1;
      }else{
        n.x+=n.vx;n.y+=n.vy;
        if(n.x<0||n.x>w)n.vx*=-1;
        if(n.y<0||n.y>h)n.vy*=-1;
      }
      ctx.beginPath();
      ctx.arc(n.x,n.y,n.r,0,Math.PI*2);
      ctx.fillStyle='rgba(100,255,150,0.6)';
      ctx.fill();
    }
    // Draw connections
    ctx.strokeStyle='rgba(100,255,150,0.1)';
    for(var i=0;i<particleNodes.length;i++){
      for(var j=i+1;j<particleNodes.length;j++){
        var dx=particleNodes[i].x-particleNodes[j].x;
        var dy=particleNodes[i].y-particleNodes[j].y;
        var dist=Math.sqrt(dx*dx+dy*dy);
        if(dist<80){
          ctx.beginPath();
          ctx.moveTo(particleNodes[i].x,particleNodes[i].y);
          ctx.lineTo(particleNodes[j].x,particleNodes[j].y);
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(drawParticleDemo);
  }
  drawParticleDemo();
}

// Structure demo
function initStructureDemo(){
  var canvas=document.getElementById('structureDemo');
  var ctx=canvas.getContext('2d');
  canvas.width=canvas.offsetWidth;
  canvas.height=300;
  var w=canvas.width,h=canvas.height;
  var nodes=[
    {name:'APK',x:w/2,y:30,children:['Manifest','Classes','Res','Lib']},
    {name:'Manifest',x:w/4,y:100,children:['Permissions','Activities']},
    {name:'Classes',x:w/2,y:100,children:['Main','Utils','Models']},
    {name:'Res',x:3*w/4,y:100,children:['Layout','Drawable']},
    {name:'Lib',x:w/2,y:170,children:['Native','JAR']}
  ];
  function drawStructure(){
    ctx.clearRect(0,0,w,h);
    ctx.font='12px Courier New';
    if(structureView==='tree'){
      nodes.forEach(function(n){
        ctx.fillStyle='rgba(100,255,150,0.8)';
        ctx.fillRect(n.x-30,n.y-10,60,20);
        ctx.fillStyle='#fff';
        ctx.fillText(n.name,n.x-25,n.y+5);
        if(n.children){
          n.children.forEach(function(c,i){
            var cx=n.x+(i-n.children.length/2)*40;
            var cy=n.y+60;
            ctx.strokeStyle='rgba(100,255,150,0.3)';
            ctx.beginPath();
            ctx.moveTo(n.x,n.y+10);
            ctx.lineTo(cx,cy-10);
            ctx.stroke();
            ctx.fillStyle='rgba(80,180,255,0.6)';
            ctx.fillRect(cx-20,cy-8,40,16);
            ctx.fillStyle='#fff';
            ctx.fillText(c,cx-15,cy+4);
          });
        }
      });
    }else{
      var centerX=w/2,centerY=h/2;
      nodes.forEach(function(n,i){
        var angle=i*Math.PI*2/nodes.length;
        var r=100;
        var x=centerX+Math.cos(angle)*r;
        var y=centerY+Math.sin(angle)*r;
        ctx.strokeStyle='rgba(100,255,150,0.3)';
        ctx.beginPath();
        ctx.moveTo(centerX,centerY);
        ctx.lineTo(x,y);
        ctx.stroke();
        ctx.fillStyle='rgba(100,255,150,0.8)';
        ctx.beginPath();
        ctx.arc(x,y,20,0,Math.PI*2);
        ctx.fill();
        ctx.fillStyle='#fff';
        ctx.fillText(n.name,x-15,y+5);
      });
      ctx.fillStyle='rgba(255,255,255,0.1)';
      ctx.beginPath();
      ctx.arc(centerX,centerY,30,0,Math.PI*2);
      ctx.fill();
      ctx.fillStyle='#fff';
      ctx.fillText('ROOT',centerX-20,centerY+5);
    }
    requestAnimationFrame(drawStructure);
  }
  drawStructure();
}

// Graph demos
function initGraphs(){
  var networkCanvas=document.getElementById('networkGraph');
  var cpuCanvas=document.getElementById('cpuGraph');
  var netCtx=networkCanvas.getContext('2d');
  var cpuCtx=cpuCanvas.getContext('2d');
  networkCanvas.width=networkCanvas.offsetWidth;
  networkCanvas.height=150;
  cpuCanvas.width=cpuCanvas.offsetWidth;
  cpuCanvas.height=150;
  var netData=[],cpuData=[];
  for(let i=0;i<60;i++){
    netData.push(30+Math.random()*20);
    cpuData.push(20+Math.random()*15);
  }
  function drawGraph(ctx,data,color){
    var w=ctx.canvas.width,h=ctx.canvas.height;
    ctx.clearRect(0,0,w,h);
    ctx.beginPath();
    ctx.moveTo(0,h-data[0]);
    for(var i=1;i<data.length;i++){
      ctx.lineTo((i/(data.length-1))*w,h-data[i]);
    }
    ctx.strokeStyle=color;
    ctx.lineWidth=1.5;
    ctx.stroke();
  }
  function updateGraphs(){
    netData.shift();
    netData.push(30+Math.sin(Date.now()*0.001)*15+Math.random()*10);
    cpuData.shift();
    cpuData.push(20+Math.cos(Date.now()*0.0015)*10+Math.random()*8);
    drawGraph(netCtx,netData,'rgba(100,255,150,0.6)');
    drawGraph(cpuCtx,cpuData,'rgba(80,180,255,0.6)');
    requestAnimationFrame(updateGraphs);
  }
  updateGraphs();
}

window.addEventListener('load',function(){
  initParticleDemo();
  initStructureDemo();
  initGraphs();
});
</script>
<script>setTimeout(function(){var o=document.getElementById("authOverlay");if(o){o.classList.add("done");setTimeout(function(){o.remove();},600);}},1500);</script>
</body>
