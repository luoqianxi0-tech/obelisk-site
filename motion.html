<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OBELISK | Motion Lab</title>
    <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-auth-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --glass: rgba(255,255,255,0.03);
            --glass-border: rgba(255,255,255,0.08);
            --accent: rgba(100,255,150,0.6);
            --accent2: rgba(80,180,255,0.6);
        }
        html, body {
            background: #000;
            color: #e0e0e5;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
        .top-bar {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            backdrop-filter: blur(10px);
        }
        .logo {
            font-size: 0.9rem;
            letter-spacing: 0.3em;
            font-weight: 300;
            color: rgba(255,255,255,0.7);
            cursor: pointer;
            text-decoration: none;
        }
        .logo:hover { color: #fff; }
        .icon-btn {
            width: 36px;
            height: 36px;
            border: 1px solid var(--glass-border);
            background: var(--glass);
            color: rgba(255,255,255,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
        }
        .icon-btn:hover {
            border-color: rgba(255,255,255,0.3);
            color: #fff;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 24px 60px;
            position: relative;
            z-index: 5;
        }
        h1 {
            font-size: 1.4rem;
            font-weight: 300;
            letter-spacing: 0.15em;
            margin-bottom: 8px;
            background: linear-gradient(180deg, #fff, rgba(255,255,255,0.5));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.3);
            letter-spacing: 0.1em;
            margin-bottom: 32px;
        }
        .viz-card {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            padding: 24px;
            margin-bottom: 24px;
            backdrop-filter: blur(10px);
            transition: border-color 0.3s;
        }
        .viz-card:hover { border-color: rgba(255,255,255,0.15); }
        .viz-title {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.4);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 16px;
        }
        .viz-canvas {
            width: 100%;
            height: 300px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.05);
        }
        .tree-node {
            padding: 8px 12px;
            margin: 2px 0;
            background: rgba(255,255,255,0.03);
            border-left: 2px solid var(--accent);
            font-size: 0.75rem;
            font-family: 'Courier New', monospace;
            color: rgba(255,255,255,0.6);
            transition: all 0.3s;
            cursor: pointer;
        }
        .tree-node:hover {
            background: rgba(255,255,255,0.06);
            color: #fff;
            border-left-color: var(--accent2);
        }
        .tree-children {
            padding-left: 20px;
            border-left: 1px solid rgba(255,255,255,0.05);
            margin-left: 4px;
        }
        .viz-stats {
            display: flex;
            gap: 24px;
            margin-top: 12px;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.4);
            font-family: 'Courier New', monospace;
        }
        .viz-stat {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .viz-stat-val {
            color: var(--accent);
        }
        @media (max-width: 768px) {
            .top-bar { padding: 16px 20px; }
            .viz-canvas { height: 200px; }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <a class="logo" href="./index.html">&#8592; OBELISK</a>
        <button class="icon-btn" onclick="toggleLang()">&#127760;</button>
    </div>
    <div class="container">
        <h1 data-i18n="title">Motion Lab</h1>
        <div class="subtitle" data-i18n="subtitle">APK Structure Visualizer & Network Topology</div>
        <div class="viz-card">
            <div class="viz-title" data-i18n="tree_title">APK File Structure</div>
            <div id="treeContainer"></div>
            <div class="viz-stats" id="treeStats"></div>
        </div>
        <div class="viz-card">
            <div class="viz-title" data-i18n="perm_title">Permission Relationship Graph</div>
            <canvas class="viz-canvas" id="permCanvas"></canvas>
            <div class="viz-stats" id="permStats"></div>
        </div>
        <div class="viz-card">
            <div class="viz-title" data-i18n="net_title">Network Traffic Topology</div>
            <canvas class="viz-canvas" id="netCanvas"></canvas>
            <div class="viz-stats" id="netStats"></div>
        </div>
    </div>
    <script>
        const i18n = {
            en: {
                title: "Motion Lab",
                subtitle: "APK Structure Visualizer & Network Topology",
                tree_title: "APK File Structure",
                perm_title: "Permission Relationship Graph",
                net_title: "Network Traffic Topology",
                no_data: "Upload an APK in Reverse Notes to visualize",
                files: "files",
                perms: "perms",
                libs: "libs",
                nodes: "nodes",
                conns: "connections"
            },
            zh: {
                title: "动效实验室",
                subtitle: "APK 结构可视化与网络拓扑",
                tree_title: "APK 文件结构",
                perm_title: "权限关系图",
                net_title: "网络流量拓扑",
                no_data: "在逆向手记中上传 APK 以可视化",
                files: "文件",
                perms: "权限",
                libs: "库",
                nodes: "节点",
                conns: "连接"
            }
        };
        let currentLang = localStorage.getItem('obelisk_lang') || 'en';
        function applyLang() {
            const t = i18n[currentLang];
            document.querySelectorAll('[data-i18n]').forEach(function(el) {
                const key = el.getAttribute('data-i18n');
                if (t[key]) el.textContent = t[key];
            });
        }
        function toggleLang() {
            currentLang = currentLang === 'en' ? 'zh' : 'en';
            localStorage.setItem('obelisk_lang', currentLang);
            applyLang();
            location.reload();
        }

        const lastAPK = JSON.parse(sessionStorage.getItem('obelisk_last_apk') || '{}');
        const t = i18n[currentLang];

        // Tree View
        const treeContainer = document.getElementById('treeContainer');
        if (lastAPK && lastAPK.filename) {
            const permCount = (lastAPK.manifest && lastAPK.manifest.permissions) ? lastAPK.manifest.permissions.length : 0;
            const libCount = (lastAPK.nativeLibs) ? lastAPK.nativeLibs.length : 0;
            treeContainer.innerHTML = 
                '<div class="tree-node">' + lastAPK.filename + '</div>' +
                '<div class="tree-children">' +
                '<div class="tree-node">AndroidManifest.xml</div>' +
                '<div class="tree-node">classes.dex</div>' +
                '<div class="tree-node">lib/ (' + libCount + ' .so)</div>' +
                '<div class="tree-children">' + (lastAPK.nativeLibs || []).map(function(l) { return '<div class="tree-node">' + l + '</div>'; }).join('') + '</div>' +
                '<div class="tree-node">res/ (resources)</div>' +
                '<div class="tree-node">META-INF/ (signatures)</div>' +
                '</div>';
            document.getElementById('treeStats').innerHTML = 
                '<div class="viz-stat"><span class="viz-stat-val">' + (lastAPK.manifest && lastAPK.manifest.permissions ? lastAPK.manifest.permissions.length : 0) + '</span> ' + t.perms + '</div>' +
                '<div class="viz-stat"><span class="viz-stat-val">' + libCount + '</span> ' + t.libs + '</div>' +
                '<div class="viz-stat"><span class="viz-stat-val">' + (lastAPK.dexStrings ? lastAPK.dexStrings.length : 0) + '</span> strings</div>';
        } else {
            treeContainer.innerHTML = '<div style="text-align:center;padding:40px;color:rgba(255,255,255,0.2);font-size:0.8rem;">' + t.no_data + '</div>';
        }

        // Permission Graph - optimized
        (function() {
            const canvas = document.getElementById('permCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            const perms = (lastAPK && lastAPK.manifest) ? (lastAPK.manifest.permissions || []) : [];
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = Math.min(canvas.width, canvas.height) * 0.35;

            if (perms.length === 0) {
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                ctx.font = '0.8rem sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(t.no_data, centerX, centerY);
                return;
            }

            const nodes = [];
            perms.forEach(function(p, i) {
                const angle = (i / perms.length) * Math.PI * 2 - Math.PI / 2;
                nodes.push({
                    x: centerX + Math.cos(angle) * radius,
                    y: centerY + Math.sin(angle) * radius,
                    label: p.replace('android.permission.', '')
                });
            });

            document.getElementById('permStats').innerHTML = 
                '<div class="viz-stat"><span class="viz-stat-val">' + perms.length + '</span> ' + t.perms + '</div>' +
                '<div class="viz-stat"><span class="viz-stat-val">' + nodes.length + '</span> ' + t.nodes + '</div>';

            var lastTime = 0;
            function draw(timestamp) {
                if (timestamp - lastTime < 33) { requestAnimationFrame(draw); return; }
                lastTime = timestamp;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.beginPath();
                ctx.arc(centerX, centerY, 6, 0, Math.PI * 2);
                ctx.fillStyle = 'var(--accent)';
                ctx.fill();
                nodes.forEach(function(n) {
                    ctx.beginPath();
                    ctx.moveTo(centerX, centerY);
                    ctx.lineTo(n.x, n.y);
                    ctx.strokeStyle = 'rgba(100,255,150,0.15)';
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(n.x, n.y, 4, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255,255,255,0.5)';
                    ctx.fill();
                    ctx.fillStyle = 'rgba(255,255,255,0.5)';
                    ctx.font = '0.65rem monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText(n.label, n.x, n.y - 10);
                });
                requestAnimationFrame(draw);
            }
            requestAnimationFrame(draw);
        })();

        // Network Topology - optimized with fewer nodes
        (function() {
            const canvas = document.getElementById('netCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            const nodes = [
                { x: canvas.width * 0.5, y: canvas.height * 0.5, label: 'APK', r: 8 },
                { x: canvas.width * 0.2, y: canvas.height * 0.3, label: 'C2', r: 5 },
                { x: canvas.width * 0.8, y: canvas.height * 0.3, label: 'API', r: 5 },
                { x: canvas.width * 0.3, y: canvas.height * 0.7, label: 'ADS', r: 5 },
                { x: canvas.width * 0.7, y: canvas.height * 0.7, label: 'CDN', r: 5 }
            ];

            document.getElementById('netStats').innerHTML = 
                '<div class="viz-stat"><span class="viz-stat-val">' + nodes.length + '</span> ' + t.nodes + '</div>' +
                '<div class="viz-stat"><span class="viz-stat-val">' + (nodes.length - 1) * 2 + '</span> ' + t.conns + '</div>';

            let frame = 0;
            var lastTime = 0;
            function draw(timestamp) {
                if (timestamp - lastTime < 33) { requestAnimationFrame(draw); return; }
                lastTime = timestamp;
                frame++;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                nodes.forEach(function(n, i) {
                    n.x += Math.sin(frame * 0.01 + i) * 0.3;
                    n.y += Math.cos(frame * 0.01 + i) * 0.3;
                });
                for (let i = 1; i < nodes.length; i++) {
                    ctx.beginPath();
                    ctx.moveTo(nodes[0].x, nodes[0].y);
                    ctx.lineTo(nodes[i].x, nodes[i].y);
                    ctx.strokeStyle = 'rgba(80,180,255,0.1)';
                    ctx.stroke();
                }
                nodes.forEach(function(n) {
                    ctx.beginPath();
                    ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
                    ctx.fillStyle = n.label === 'APK' ? 'var(--accent)' : 'rgba(80,180,255,0.6)';
                    ctx.fill();
                    ctx.fillStyle = 'rgba(255,255,255,0.5)';
                    ctx.font = '0.65rem monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText(n.label, n.x, n.y - 12);
                });
                requestAnimationFrame(draw);
            }
            requestAnimationFrame(draw);
        })();

        applyLang();
    </script>
</body>
</html>
