<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--glass:rgba(255,255,255,0.03);--glass-border:rgba(255,255,255,0.08);--accent:rgba(100,255,150,0.6);--accent2:rgba(80,180,255,0.6);--danger:rgba(255,80,80,0.6);--warn:rgba(255,200,80,0.7)}
html,body{background:#000;color:#e0e0e5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px}

/* Auth Loading */
.auth-overlay{position:fixed;inset:0;background:#000;z-index:99999;display:flex;align-items:center;justify-content:center;transition:opacity 0.5s ease,visibility 0.5s ease}
.auth-overlay.done{opacity:0;visibility:hidden;pointer-events:none}
.auth-overlay .spinner{width:36px;height:36px;border:1px solid rgba(255,255,255,0.1);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.top-bar{position:relative;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:20px 40px;backdrop-filter:blur(10px)}
.logo{font-size:0.9rem;letter-spacing:0.3em;font-weight:300;color:rgba(255,255,255,0.7);cursor:pointer;text-decoration:none}
.logo:hover{color:#fff}
.icon-btn{width:36px;height:36px;border:1px solid var(--glass-border);background:var(--glass);color:rgba(255,255,255,0.4);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.3s;font-size:1rem}
.icon-btn:hover{border-color:rgba(255,255,255,0.3);color:#fff}
.container{max-width:900px;margin:0 auto;padding:0 24px 60px;position:relative;z-index:5}
h1{font-size:1.4rem;font-weight:300;letter-spacing:0.15em;margin-bottom:8px;background:linear-gradient(180deg,#fff,rgba(255,255,255,0.5));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{font-size:0.75rem;color:rgba(255,255,255,0.3);letter-spacing:0.1em;margin-bottom:32px}
.drop-zone{border:2px dashed rgba(255,255,255,0.15);padding:60px 40px;text-align:center;transition:all 0.4s;cursor:pointer;background:var(--glass);backdrop-filter:blur(10px)}
.drop-zone:hover,.drop-zone.dragover{border-color:var(--accent);background:rgba(100,255,150,0.02)}
.drop-zone .icon{font-size:2.5rem;margin-bottom:16px;opacity:0.5}
.drop-zone p{font-size:0.85rem;color:rgba(255,255,255,0.5);letter-spacing:0.05em}
.drop-zone .hint{font-size:0.65rem;color:rgba(255,255,255,0.25);margin-top:8px}
.report{margin-top:32px;display:none}
.report.show{display:block;animation:fadeInUp 0.6s ease}
.report-card{background:var(--glass);border:1px solid var(--glass-border);padding:24px;margin-bottom:16px;backdrop-filter:blur(10px);transition:border-color 0.3s}
.report-card:hover{border-color:rgba(255,255,255,0.15)}
.report-title{font-size:0.75rem;color:rgba(255,255,255,0.4);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:12px}
.report-value{font-size:1rem;color:rgba(255,255,255,0.8);font-family:'Courier New',monospace;word-break:break-all}
.risk-badge{display:inline-block;padding:4px 12px;font-size:0.75rem;letter-spacing:0.1em;border:1px solid;margin-top:8px}
.risk-high{color:var(--danger);border-color:var(--danger)}.risk-mid{color:var(--warn);border-color:var(--warn)}.risk-low{color:var(--accent);border-color:var(--accent)}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{padding:4px 10px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);font-size:0.65rem;color:rgba(255,255,255,0.5);font-family:'Courier New',monospace}
.tag.danger{border-color:var(--danger);color:rgba(255,80,80,0.8)}.tag.warn{border-color:var(--warn);color:rgba(255,200,80,0.8)}.tag.safe{border-color:var(--accent);color:var(--accent)}
.action-bar{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap}
.action-btn{padding:10px 24px;background:transparent;border:1px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.6);font-size:0.75rem;letter-spacing:0.1em;cursor:pointer;transition:all 0.3s;font-family:inherit}
.action-btn:hover{border-color:rgba(255,255,255,0.3);color:#fff;background:rgba(255,255,255,0.05)}
.action-btn.primary{background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.25);color:#fff}
.action-btn.primary:hover{background:rgba(255,255,255,0.12)}
.action-btn:disabled{opacity:0.4;cursor:not-allowed}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.7);padding:10px 24px;font-size:0.75rem;letter-spacing:0.1em;backdrop-filter:blur(10px);z-index:99999;transition:opacity 0.5s;white-space:nowrap}
@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:768px){.top-bar{padding:16px 20px}.drop-zone{padding:40px 20px}.action-bar{flex-direction:column}.action-btn{width:100%}}
</style>
</head>
<body>
<div class="auth-overlay" id="authOverlay"><div class="spinner"></div></div>
<div class="top-bar">
<a class="logo" href="./index.html">&#8592; OBELISK</a>
<button class="icon-btn" onclick="toggleLang()">&#127760;</button>
</div>
<div class="container">
<h1 data-i18n="title">Reverse Notes</h1>
<div class="subtitle" data-i18n="subtitle">APK Analyzer & Static Scanner</div>
<div class="drop-zone" id="dropZone">
<div class="icon">&#9650;</div>
<p data-i18n="drop_text">Drop APK here or click to upload</p>
<div class="hint" data-i18n="drop_hint">Max 50MB &middot; Pure client-side analysis</div>
<input type="file" id="fileInput" accept=".apk" style="display:none">
</div>
<div class="report" id="report">
<div class="report-card"><div class="report-title" data-i18n="pkg_name">Package Name</div><div class="report-value" id="pkgName">-</div></div>
<div class="report-card"><div class="report-title" data-i18n="version">Version</div><div class="report-value" id="version">-</div></div>
<div class="report-card"><div class="report-title" data-i18n="risk">Risk Assessment</div><div class="report-value" id="riskScore">-</div><div class="risk-badge" id="riskBadge">-</div></div>
<div class="report-card"><div class="report-title" data-i18n="permissions">Permissions</div><div class="tag-list" id="permList"></div></div>
<div class="report-card"><div class="report-title" data-i18n="libraries">Native Libraries</div><div class="tag-list" id="libList"></div></div>
<div class="report-card"><div class="report-title" data-i18n="strings">Suspicious Strings</div><div class="tag-list" id="strList"></div></div>
<div class="action-bar">
<button class="action-btn primary" id="btnSaveProfile" onclick="saveToProfile()" data-i18n="save_profile">Save to Profile</button>
<button class="action-btn" id="btnAddArsenal" onclick="addToArsenal()" data-i18n="add_arsenal">Add to Arsenal</button>
<button class="action-btn" id="btnVisualize" onclick="visualize()" data-i18n="visualize">Visualize Structure</button>
</div>
</div>
</div>
<script>
const ADMIN_UIDS=['nCZLU2r9YfXVTrQ79EJqWJxPPT03'];
const i18n={
en:{title:"Reverse Notes",subtitle:"APK Analyzer & Static Scanner",drop_text:"Drop APK here or click to upload",drop_hint:"Max 50MB · Pure client-side analysis",pkg_name:"Package Name",version:"Version",risk:"Risk Assessment",permissions:"Permissions",libraries:"Native Libraries",strings:"Suspicious Strings",save_profile:"Save to Profile",add_arsenal:"Add to Arsenal",visualize:"Visualize Structure",analyzing:"Analyzing...",complete:"Analysis Complete",failed:"Analysis failed",risk_high:"HIGH RISK",risk_mid:"MEDIUM RISK",risk_low:"LOW RISK",need_login:"Please sign in first",saved_ok:"Saved to profile",saved_fail:"Save failed",added_ok:"Added to arsenal",no_apk:"No analysis data"},
zh:{title:"逆向手记",subtitle:"APK 分析与静态扫描",drop_text:"拖拽 APK 到此处或点击上传",drop_hint:"最大 50MB · 纯客户端分析",pkg_name:"包名",version:"版本",risk:"风险评估",permissions:"权限列表",libraries:"原生库",strings:"可疑字符串",save_profile:"保存到档案",add_arsenal:"加入军火库",visualize:"可视化结构",analyzing:"分析中...",complete:"分析完成",failed:"分析失败",risk_high:"高风险",risk_mid:"中风险",risk_low:"低风险",need_login:"请先登录",saved_ok:"已保存到档案",saved_fail:"保存失败",added_ok:"已加入军火库",no_apk:"没有分析数据"}
};
let currentLang=localStorage.getItem('obelisk_lang')||'en';
let authReady=false;
function applyLang(){
const t=i18n[currentLang];
document.querySelectorAll('[data-i18n]').forEach(function(el){const key=el.getAttribute('data-i18n');if(t[key])el.textContent=t[key];});
}
function toggleLang(){currentLang=currentLang==='en'?'zh':'en';localStorage.setItem('obelisk_lang',currentLang);applyLang();}
function hideAuthOverlay(){
  window.__authOverlayRemoved=true;const o=document.getElementById('authOverlay');if(o){o.classList.add('done');setTimeout(function(){o.remove();},600);}}

const firebaseConfig={apiKey:"AIzaSyAlvwV6tQMdLGAYnGZsMxwIW5B8cYdiKNY",authDomain:"obelisk-ca117.firebaseapp.com",projectId:"obelisk-ca117",storageBucket:"obelisk-ca117.firebasestorage.app",messagingSenderId:"574365252836",appId:"1:574365252836:web:f8c21cc4cb1bdcd46480f1",measurementId:"G-D0P8QL36G8"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
const db=firebase.firestore();
let currentUser=null;
let lastAnalysis=null;

auth.onAuthStateChanged(function(user){
  authReady=true;
  currentUser=user;
  hideAuthOverlay();
});

const dropZone=document.getElementById('dropZone');
const fileInput=document.getElementById('fileInput');
dropZone.addEventListener('click',function(){fileInput.click();});
dropZone.addEventListener('dragover',function(e){e.preventDefault();this.classList.add('dragover');});
dropZone.addEventListener('dragleave',function(){this.classList.remove('dragover');});
dropZone.addEventListener('drop',function(e){e.preventDefault();this.classList.remove('dragover');handleFile(e.dataTransfer.files[0]);});
fileInput.addEventListener('change',function(){handleFile(this.files[0]);});

function showToast(msg){
const existing=document.querySelector('.toast');if(existing)existing.remove();
const toast=document.createElement('div');toast.className='toast';toast.textContent=msg;document.body.appendChild(toast);
setTimeout(function(){toast.style.opacity='0';},2500);setTimeout(function(){toast.remove();},3000);
}

async function handleFile(file){
const t=i18n[currentLang];
if(!file||!file.name.endsWith('.apk')){showToast('Please upload an APK file');return;}
if(file.size>50*1024*1024){showToast('File too large (max 50MB)');return;}
dropZone.innerHTML='<div class="icon">&#8987;</div><p>'+t.analyzing+'</p><div class="hint">'+file.name+'</div>';
try{
const arrayBuffer=await file.arrayBuffer();
const result=await parseAPK(arrayBuffer,file.name);
lastAnalysis=result;
showReport(result);
showToast(t.complete);
}catch(err){
console.error(err);
dropZone.innerHTML='<div class="icon">&#10008;</div><p>'+t.failed+'</p><div class="hint">'+(err.message||'Unknown error')+'</div>';
showToast(t.failed);
}
}

async function parseAPK(arrayBuffer,filename){
const zip=await JSZip.loadAsync(arrayBuffer);
const manifestFile=zip.file('AndroidManifest.xml');
let manifest={package:'',versionCode:'',versionName:'',permissions:[]};
if(manifestFile){
const data=await manifestFile.async('uint8array');
manifest=parseAXML(data);
}
const dexStrings=[];
const nativeLibs=[];
for(const[name,file]of Object.entries(zip.files)){
if(name.endsWith('.dex')){const dexData=await file.async('uint8array');dexStrings.push(...extractDexStrings(dexData));}
if(name.endsWith('.so'))nativeLibs.push(name);
}
const suspicious=extractSuspicious(dexStrings);
const risk=calculateRisk(manifest,suspicious,nativeLibs);
return{filename,manifest,dexStrings,nativeLibs,suspicious,risk,timestamp:Date.now()};
}

function parseAXML(data){
const result={package:'',versionCode:'',versionName:'',permissions:[]};
const text=String.fromCharCode.apply(null,data);
const permMatches=text.match(/android\.permission\.[A-Z_]+/g);
if(permMatches)result.permissions=[...new Set(permMatches)];
const pkgMatch=text.match(/package="([^"]+)"/);
if(pkgMatch)result.package=pkgMatch[1];
const verMatch=text.match(/android:versionName="([^"]+)"/);
if(verMatch)result.versionName=verMatch[1];
if(!result.versionName){
const verCode=text.match(/android:versionCode="(\d+)"/);
if(verCode)result.versionName=verCode[1];
}
return result;
}

function extractDexStrings(data){
const strings=[];
const len=data.length;
for(let i=0;i<len-10;i++){
if(data[i]===0x68&&data[i+1]===0x74&&data[i+2]===0x74&&data[i+3]===0x70){
let s='';for(let j=i;j<i+200&&j<len;j++){if(data[j]===0)break;if(data[j]>=32&&data[j]<127)s+=String.fromCharCode(data[j]);else break;}
if(s.length>10)strings.push(s);
}
if(data[i]===0x61&&data[i+1]===0x70&&data[i+2]===0x69&&data[i+3]===0x2E){
let s='';for(let j=i;j<i+100&&j<len;j++){if(data[j]===0)break;if(data[j]>=32&&data[j]<127)s+=String.fromCharCode(data[j]);else break;}
if(s.length>5&&s.includes('.'))strings.push(s);
}
}
return[...new Set(strings)];
}

function extractSuspicious(strings){
const patterns=['http://','https://','api.','token','secret','password','key','auth','c2','cmd','shell'];
return strings.filter(function(s){return patterns.some(function(p){return s.toLowerCase().includes(p);});});
}

function calculateRisk(manifest,suspicious,nativeLibs){
let score=0;
const highRisk=['READ_CONTACTS','RECORD_AUDIO','CAMERA','ACCESS_FINE_LOCATION','READ_SMS','SEND_SMS','CALL_PHONE','READ_PHONE_STATE'];
const midRisk=['WRITE_EXTERNAL_STORAGE','ACCESS_COARSE_LOCATION','GET_ACCOUNTS'];
(manifest.permissions||[]).forEach(function(p){
if(highRisk.some(function(h){return p.includes(h);}))score+=12;
else if(midRisk.some(function(m){return p.includes(m);}))score+=6;
else score+=2;
});
score+=suspicious.length*5;
score+=nativeLibs.length*3;
return Math.min(score,100);
}

function showReport(r){
const t=i18n[currentLang];
document.getElementById('pkgName').textContent=r.manifest.package||'Unknown';
document.getElementById('version').textContent=r.manifest.versionName||'Unknown';
document.getElementById('riskScore').textContent=r.risk+'/100';
const badge=document.getElementById('riskBadge');
badge.className='risk-badge '+(r.risk>=60?'risk-high':r.risk>=30?'risk-mid':'risk-low');
badge.textContent=r.risk>=60?t.risk_high:r.risk>=30?t.risk_mid:t.risk_low;
const permList=document.getElementById('permList');permList.innerHTML='';
(r.manifest.permissions||[]).forEach(function(p){
const div=document.createElement('span');
const isDanger=p.includes('CONTACTS')||p.includes('LOCATION')||p.includes('SMS')||p.includes('PHONE')||p.includes('CAMERA');
const isWarn=p.includes('STORAGE')||p.includes('MICROPHONE');
div.className='tag'+(isDanger?' danger':isWarn?' warn':' safe');
div.textContent=p.replace('android.permission.','');
permList.appendChild(div);
});
const libList=document.getElementById('libList');libList.innerHTML='';
if(r.nativeLibs.length===0){libList.innerHTML='<span class="tag">None</span>';}
else r.nativeLibs.forEach(function(l){const div=document.createElement('span');div.className='tag';div.textContent=l.split('/').pop();libList.appendChild(div);});
const strList=document.getElementById('strList');strList.innerHTML='';
if(r.suspicious.length===0){strList.innerHTML='<span class="tag safe">None found</span>';}
else r.suspicious.forEach(function(s){const div=document.createElement('span');div.className='tag warn';div.textContent=s.length>40?s.slice(0,40)+'...':s;strList.appendChild(div);});
document.getElementById('report').classList.add('show');
dropZone.innerHTML='<div class="icon">&#10003;</div><p>'+t.complete+'</p><div class="hint">'+r.filename+'</div>';
}

function saveToProfile(){
const t=i18n[currentLang];
if(!currentUser){showToast(t.need_login);return;}
if(!lastAnalysis){showToast(t.no_apk);return;}
const uid=currentUser.uid;
const appData={
name:lastAnalysis.filename.replace('.apk',''),
pkg:lastAnalysis.manifest.package||'unknown',
date:new Date().toISOString().slice(0,10),
risk:lastAnalysis.risk>=60?'high':lastAnalysis.risk>=30?'mid':'low',
permissions:lastAnalysis.manifest.permissions.map(function(p){return p.replace('android.permission.','');}),
findings:lastAnalysis.suspicious
};
db.collection('users').doc(uid).update({
recentApps:firebase.firestore.FieldValue.arrayUnion(appData),
logs:firebase.firestore.FieldValue.arrayUnion({action:'APK scan: '+appData.pkg,type:'SCAN',time:Date.now()}),
'stats.scans':firebase.firestore.FieldValue.increment(1)
}).then(function(){showToast(t.saved_ok);}).catch(function(err){console.error(err);showToast(t.saved_fail+': '+err.message);});
}

function addToArsenal(){
const t=i18n[currentLang];
if(!currentUser){showToast(t.need_login);return;}
if(!lastAnalysis){showToast(t.no_apk);return;}
const tool={name:'APK Scanner: '+lastAnalysis.filename.replace('.apk','').slice(0,20),cat:'Scanner',desc:'Static analysis of '+lastAnalysis.filename,url:'',version:'1.0',status:'active'};
db.collection('users').doc(currentUser.uid).update({
arsenal:firebase.firestore.FieldValue.arrayUnion(tool)
}).then(function(){showToast(t.added_ok);}).catch(function(err){showToast(t.saved_fail);});
}

function visualize(){
if(!lastAnalysis){showToast(i18n[currentLang].no_apk);return;}
sessionStorage.setItem('obelisk_last_apk',JSON.stringify(lastAnalysis));
window.location.href='./motion.html';
}

applyLang();

// Auth overlay safety timeout
setTimeout(function(){if(!window.__authOverlayRemoved)hideAuthOverlay();},5000);
</script>
</body>
