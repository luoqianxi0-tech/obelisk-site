<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

</script>

document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){document.getElementById('resourceModal').classList.remove('show');}
  if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();document.getElementById('searchInput').focus();}
});

<script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore-compat.js">
// Auth overlay safety timeout

document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){document.getElementById('resourceModal').classList.remove('show');}
  if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();document.getElementById('searchInput').focus();}
});

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--glass:rgba(255,255,255,0.03);--glass-border:rgba(255,255,255,0.08);--accent:rgba(100,255,150,0.6);--accent2:rgba(80,180,255,0.6)}
html,body{background:#000;color:#e0e0e5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px}

/* Auth Loading */
.auth-overlay{position:fixed;inset:0;background:#000;z-index:99999;display:flex;align-items:center;justify-content:center;transition:opacity 0.5s ease,visibility 0.5s ease}
.auth-overlay.done{opacity:0;visibility:hidden;pointer-events:none}
.auth-overlay .spinner{width:36px;height:36px;border:1px solid rgba(255,255,255,0.1);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.top-bar{position:relative;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:20px 40px;backdrop-filter:blur(10px)}
.logo{font-size:0.9rem;letter-spacing:0.3em;font-weight:300;color:rgba(255,255,255,0.7);cursor:pointer;text-decoration:none}
.logo:hover{color:#fff}
.icon-btn{width:36px;height:36px;border:1px solid var(--glass-border);background:var(--glass);color:rgba(255,255,255,0.4);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.3s;font-size:1rem}
.icon-btn:hover{border-color:rgba(255,255,255,0.3);color:#fff}
.container{max-width:900px;margin:0 auto;padding:0 24px 60px;position:relative;z-index:5}
h1{font-size:1.4rem;font-weight:300;letter-spacing:0.15em;margin-bottom:8px;background:linear-gradient(180deg,#fff,rgba(255,255,255,0.5));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{font-size:0.75rem;color:rgba(255,255,255,0.3);letter-spacing:0.1em;margin-bottom:32px}
.search-bar{display:flex;gap:12px;margin-bottom:32px}
.search-input{flex:1;padding:12px 16px;background:var(--glass);border:1px solid var(--glass-border);color:#fff;font-size:0.85rem;font-family:inherit;outline:none;transition:border-color 0.3s}
.search-input:focus{border-color:var(--accent)}
.search-input::placeholder{color:rgba(255,255,255,0.2)}
.search-btn{padding:12px 24px;background:var(--glass);border:1px solid var(--glass-border);color:rgba(255,255,255,0.6);font-size:0.75rem;letter-spacing:0.1em;cursor:pointer;transition:all 0.3s;font-family:inherit}
.search-btn:hover{border-color:rgba(255,255,255,0.3);color:#fff;background:rgba(255,255,255,0.05)}
.cat-nav{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}
.cat-btn{padding:8px 16px;background:transparent;border:1px solid var(--glass-border);color:rgba(255,255,255,0.4);font-size:0.7rem;letter-spacing:0.1em;cursor:pointer;transition:all 0.3s;font-family:inherit}
.cat-btn:hover,.cat-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(100,255,150,0.03)}
.resource-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.resource-item{background:var(--glass);border:1px solid var(--glass-border);padding:20px;transition:all 0.4s;cursor:pointer;position:relative;overflow:hidden;backdrop-filter:blur(10px);text-decoration:none;color:inherit;display:block}
.resource-item:hover{border-color:rgba(255,255,255,0.2);transform:translateY(-3px);background:rgba(255,255,255,0.05)}
.resource-item::after{content:'';position:absolute;top:0;left:0;width:2px;height:0;background:var(--accent2);transition:height 0.4s}
.resource-item:hover::after{height:100%}
.resource-name{font-size:0.85rem;color:rgba(255,255,255,0.8);letter-spacing:0.02em;margin-bottom:4px}
.resource-url{font-size:0.65rem;color:var(--accent2);font-family:'Courier New',monospace;margin-bottom:8px;word-break:break-all}
.resource-desc{font-size:0.65rem;color:rgba(255,255,255,0.3);line-height:1.5}
.resource-tags{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.resource-tag{padding:2px 8px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);font-size:0.6rem;color:rgba(255,255,255,0.4)}
.resource-actions{display:flex;gap:8px;margin-top:12px}
.r-btn{padding:6px 12px;background:transparent;border:1px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.4);font-size:0.6rem;letter-spacing:0.1em;cursor:pointer;transition:all 0.3s;font-family:inherit}
.r-btn:hover{border-color:rgba(255,255,255,0.3);color:#fff}
.add-resource-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;background:transparent;border:1px dashed rgba(255,255,255,0.15);color:rgba(255,255,255,0.4);font-size:0.75rem;letter-spacing:0.1em;cursor:pointer;transition:all 0.3s;grid-column:1/-1;margin-top:8px}
.add-resource-btn:hover{border-color:rgba(255,255,255,0.3);color:#fff;background:rgba(255,255,255,0.03)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.92);backdrop-filter:blur(30px);z-index:20000;display:none;align-items:center;justify-content:center;opacity:0;transition:opacity 0.4s;overflow-y:auto;padding:40px 20px}
.modal-overlay.show{display:flex;opacity:1}
.modal-box{background:rgba(8,8,8,0.98);border:1px solid rgba(255,255,255,0.12);padding:40px;max-width:420px;width:90%;position:relative;transform:translateY(20px);transition:transform 0.4s cubic-bezier(0.4,0,0.2,1)}
.modal-overlay.show .modal-box{transform:translateY(0)}
.modal-box h3{font-size:1rem;font-weight:300;letter-spacing:0.15em;margin-bottom:24px;color:#fff}
.modal-close{position:absolute;top:16px;right:16px;width:32px;height:32px;background:transparent;border:1px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.4);cursor:pointer;font-size:1rem;transition:all 0.3s;display:flex;align-items:center;justify-content:center}
.modal-close:hover{border-color:rgba(255,255,255,0.3);color:#fff}
.modal-input{width:100%;padding:12px 16px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.1);color:#fff;font-size:0.85rem;font-family:inherit;margin-bottom:16px;outline:none;transition:border-color 0.3s}
.modal-input:focus{border-color:var(--accent)}
.modal-input::placeholder{color:rgba(255,255,255,0.2)}
.modal-actions{display:flex;gap:12px;justify-content:flex-end}
.modal-btn{padding:10px 24px;background:transparent;border:1px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.6);font-size:0.75rem;letter-spacing:0.1em;cursor:pointer;transition:all 0.3s;font-family:inherit}
.modal-btn.primary{background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.25);color:#fff}
.modal-btn:hover{border-color:rgba(255,255,255,0.4);color:#fff}
.modal-btn.primary:hover{background:rgba(255,255,255,0.12)}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.7);padding:10px 24px;font-size:0.75rem;letter-spacing:0.1em;backdrop-filter:blur(10px);z-index:99999;transition:opacity 0.5s;white-space:nowrap}
@media(max-width:768px){.resource-grid{grid-template-columns:1fr}.top-bar{padding:16px 20px}}
</style>
</head>
<body>
<div class="file-warn" id="fileWarn" style="position:fixed;top:0;left:0;right:0;background:rgba(255,200,80,0.12);border-bottom:1px solid rgba(255,200,80,0.4);color:rgba(255,200,80,0.9);padding:10px;text-align:center;font-size:0.7rem;z-index:100000;letter-spacing:0.1em;display:none">⚠ RUNNING FROM LOCAL FILE - Firebase will fail. Use HTTPS URL instead.
<script>if(location.protocol==="file:")document.getElementById("fileWarn").style.display="block";</script>
</div>
<div class="auth-overlay" id="authOverlay"><div class="spinner"></div></div>
<div class="top-bar">
<a class="logo" href="./index.html">&#8592; OBELISK</a>
<button class="icon-btn" onclick="toggleLang()">&#127760;</button>
</div>
<div class="container">
<h1 data-i18n="title">Dark Nav</h1>
<div class="subtitle" data-i18n="subtitle">Security Resource Index & Tool Directory</div>
<div class="search-bar">
<input class="search-input" id="searchInput" placeholder="Search resources..." data-i18n-placeholder="search_placeholder">
<button class="search-btn" onclick="filterResources()" data-i18n="search">Search</button>
</div>
<div class="cat-nav">
<button class="cat-btn active" onclick="filterCat('all')" data-i18n="cat_all">All</button>
<button class="cat-btn" onclick="filterCat('blog')" data-i18n="cat_blog">Blogs</button>
<button class="cat-btn" onclick="filterCat('ctf')" data-i18n="cat_ctf">CTF</button>
<button class="cat-btn" onclick="filterCat('tool')" data-i18n="cat_tool">Tools</button>
<button class="cat-btn" onclick="filterCat('docs')" data-i18n="cat_docs">Docs</button>
<button class="cat-btn" onclick="filterCat('tor')" data-i18n="cat_tor">Tor</button>
</div>
<div class="resource-grid" id="resourceGrid"></div>
<button class="add-resource-btn" onclick="openAddResource()" data-i18n="add_resource">+ Add Resource</button>
</div>
<div class="modal-overlay" id="resourceModal">
<div class="modal-box">
<button class="modal-close" onclick="closeAddResource()">&#215;</button>
<h3 data-i18n="modal_title">Add Resource</h3>
<input class="modal-input" id="resName" placeholder="Name" data-i18n-placeholder="ph_name">
<input class="modal-input" id="resUrl" placeholder="URL" data-i18n-placeholder="ph_url">
<input class="modal-input" id="resDesc" placeholder="Description" data-i18n-placeholder="ph_desc">
<input class="modal-input" id="resCat" placeholder="Category (blog/ctf/tool/docs/tor)" data-i18n-placeholder="ph_cat">
<input class="modal-input" id="resTags" placeholder="Tags (comma separated)" data-i18n-placeholder="ph_tags">
<div class="modal-actions">
<button class="modal-btn" onclick="closeAddResource()" data-i18n="btn_cancel">Cancel</button>
<button class="modal-btn primary" onclick="saveResource()" data-i18n="btn_save">Save</button>
</div>
</div>
</div>
<script>
const ADMIN_UIDS=['nCZLU2r9YfXVTrQ79EJqWJxPPT03'];
const i18n={
en:{title:"Dark Nav",subtitle:"Security Resource Index & Tool Directory",search:"Search",search_placeholder:"Search resources...",cat_all:"All",cat_blog:"Blogs",cat_ctf:"CTF",cat_tool:"Tools",cat_docs:"Docs",cat_tor:"Tor",add_resource:"+ Add Resource",modal_title:"Add Resource",ph_name:"Name",ph_url:"URL",ph_desc:"Description",ph_cat:"Category (blog/ctf/tool/docs/tor)",ph_tags:"Tags (comma separated)",btn_cancel:"Cancel",btn_save:"Save",collect:"Collect",arsenal:"Arsenal",need_login:"Please sign in",collect_ok:"Collected",add_ok:"Added to arsenal",save_ok:"Resource added"},
zh:{title:"暗网导航",subtitle:"安全资源索引与工具目录",search:"搜索",search_placeholder:"搜索资源...",cat_all:"全部",cat_blog:"博客",cat_ctf:"CTF",cat_tool:"工具",cat_docs:"文档",cat_tor:"Tor",add_resource:"+ 添加资源",modal_title:"添加资源",ph_name:"名称",ph_url:"链接",ph_desc:"描述",ph_cat:"分类 (blog/ctf/tool/docs/tor)",ph_tags:"标签 (逗号分隔)",btn_cancel:"取消",btn_save:"保存",collect:"收藏",arsenal:"军火库",need_login:"请先登录",collect_ok:"已收藏",add_ok:"已加入军火库",save_ok:"资源已添加"}
};
let currentLang=localStorage.getItem('obelisk_lang')||'en';
let authReady=false;
function applyLang(){
const t=i18n[currentLang];
document.querySelectorAll('[data-i18n]').forEach(function(el){const key=el.getAttribute('data-i18n');if(t[key])el.textContent=t[key];});
document.querySelectorAll('[data-i18n-placeholder]').forEach(function(el){const key=el.getAttribute('data-i18n-placeholder');if(t[key])el.placeholder=t[key];});
}
function toggleLang(){currentLang=currentLang==='en'?'zh':'en';localStorage.setItem('obelisk_lang',currentLang);applyLang();}
function hideAuthOverlay(){window.__authOverlayRemoved=true;window.__authOverlayRemoved=true;
  window.__authOverlayRemoved=true;const o=document.getElementById('authOverlay');if(o){o.classList.add('done');setTimeout(function(){o.remove();},600);}}

const firebaseConfig={apiKey:"AIzaSyAlvwV6tQMdLGAYnGZsMxwIW5B8cYdiKNY",authDomain:"obelisk-ca117.firebaseapp.com",projectId:"obelisk-ca117",storageBucket:"obelisk-ca117.firebasestorage.app",messagingSenderId:"574365252836",appId:"1:574365252836:web:f8c21cc4cb1bdcd46480f1",measurementId:"G-D0P8QL36G8"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
const db=firebase.firestore();
let currentUser=null;
let allResources=[];
let currentCat='all';

auth.onAuthStateChanged(function(user){
try{
  authReady=true;
  currentUser=user;
  hideAuthOverlay();
});

const defaultResources=[
{name:"Frida Docs",url:"https://frida.re/docs/home/",desc:"Official Frida instrumentation documentation",category:"docs",tags:["frida","hook","runtime"],addedBy:"system"},
{name:"Android Security",url:"https://developer.android.com/topic/security",desc:"Official Android security best practices",category:"docs",tags:["android","security","google"],addedBy:"system"},
{name:"OWASP Mobile",url:"https://owasp.org/www-project-mobile-security/",desc:"OWASP Mobile Security Testing Guide",category:"docs",tags:["owasp","mobile","testing"],addedBy:"system"},
{name:"Hack The Box",url:"https://www.hackthebox.com/",desc:"Penetration testing labs and CTF challenges",category:"ctf",tags:["ctf","pentest","lab"],addedBy:"system"},
{name:"TryHackMe",url:"https://tryhackme.com/",desc:"Guided cybersecurity training platform",category:"ctf",tags:["training","ctf","beginner"],addedBy:"system"},
{name:"PortSwigger",url:"https://portswigger.net/web-security",desc:"Web security academy and Burp Suite docs",category:"tool",tags:["burp","web","proxy"],addedBy:"system"},
{name:"Ghidra",url:"https://ghidra-sre.org/",desc:"NSA reverse engineering framework",category:"tool",tags:["re","decompiler","nsa"],addedBy:"system"},
{name:"APKTool",url:"https://ibotpeaches.github.io/Apktool/",desc:"APK reverse engineering tool",category:"tool",tags:["apk","reverse","android"],addedBy:"system"},
{name:"Tor Project",url:"https://www.torproject.org/",desc:"Anonymous communication network",category:"tor",tags:["tor","privacy","anonymity"],addedBy:"system"},
{name:"Rapid7 Vulndb",url:"https://www.rapid7.com/db/",desc:"Vulnerability and exploit database",category:"blog",tags:["vuln","exploit","db"],addedBy:"system"}
];

function showToast(msg){
const existing=document.querySelector('.toast');if(existing)existing.remove();
const toast=document.createElement('div');toast.className='toast';toast.textContent=msg;document.body.appendChild(toast);
setTimeout(function(){toast.style.opacity='0';},2500);setTimeout(function(){toast.remove();},3000);
}

function loadResources(){
db.collection('resources').get().then(function(snap){
allResources=[];
snap.forEach(function(doc){allResources.push(doc.data());});
if(allResources.length===0){
defaultResources.forEach(function(r){db.collection('resources').add(r);});
allResources=defaultResources.slice();
}
renderResources(allResources);
}).catch(function(err){
console.error('[DarkNav] Firestore error:',err);
allResources=defaultResources.slice();
renderResources(allResources);
});
}

function renderResources(list){
const grid=document.getElementById('resourceGrid');grid.innerHTML='';
const t=i18n[currentLang];
list.forEach(function(r){
const div=document.createElement('div');div.className='resource-item';
div.onclick=function(e){if(e.target.tagName==='BUTTON')return;window.open(r.url,'_blank');};
const tagsHtml=(r.tags||[]).map(function(t){return'<span class="resource-tag">'+t+'</span>';}).join('');
div.innerHTML='<div class="resource-name">'+escapeHtml(r.name)+'</div><div class="resource-url">'+escapeHtml(r.url)+'</div><div class="resource-desc">'+escapeHtml(r.desc)+'</div><div class="resource-tags">'+tagsHtml+'</div><div class="resource-actions"><button class="r-btn" onclick="collectResource(event,''+escapeJs(r.name)+'')">'+t.collect+'</button><button class="r-btn" onclick="addToArsenal(event,''+escapeJs(r.name)+'',''+escapeJs(r.url)+'')">'+t.arsenal+'</button></div>';
grid.appendChild(div);
});
}

function filterCat(cat){
document.querySelectorAll('.cat-btn').forEach(function(b){b.classList.remove('active');});
event.target.classList.add('active');
currentCat=cat;
if(cat==='all')renderResources(allResources);
else renderResources(allResources.filter(function(r){return r.category===cat;}));
}

function filterResources(){
const q=document.getElementById('searchInput').value.toLowerCase();
const filtered=allResources.filter(function(r){return(r.name+' '+r.desc+' '+(r.tags||[]).join(' ')).toLowerCase().includes(q);});
if(currentCat!=='all')renderResources(filtered.filter(function(r){return r.category===currentCat;}));
else renderResources(filtered);
}

function collectResource(e,name){
e.stopPropagation();
const t=i18n[currentLang];
if(!currentUser){showToast(t.need_login);return;}
db.collection('users').doc(currentUser.uid).update({
collections:firebase.firestore.FieldValue.arrayUnion({type:'resource',name:name,time:Date.now()})
}).then(function(){showToast(t.collect_ok);}).catch(function(err){showToast('Error: '+err.message);});
}

function addToArsenal(e,name,url){
e.stopPropagation();
const t=i18n[currentLang];
if(!currentUser){showToast(t.need_login);return;}
const tool={name:name,cat:'Resource',desc:'From Dark Nav',url:url||'',version:'N/A',status:'ready'};
db.collection('users').doc(currentUser.uid).update({
arsenal:firebase.firestore.FieldValue.arrayUnion(tool)
}).then(function(){showToast(t.add_ok);}).catch(function(err){showToast('Error: '+err.message);});
}

function openAddResource(){document.getElementById('resourceModal').classList.add('show');}
function closeAddResource(){document.getElementById('resourceModal').classList.remove('show');}
function saveResource(){
const t=i18n[currentLang];
const name=document.getElementById('resName').value.trim();
const url=document.getElementById('resUrl').value.trim();
const desc=document.getElementById('resDesc').value.trim();
const cat=document.getElementById('resCat').value.trim()||'tool';
const tags=document.getElementById('resTags').value.split(',').map(function(t){return t.trim();}).filter(function(t){return t;});
if(!name||!url){showToast('Name and URL required');return;}
const resource={name:name,url:url,desc:desc,category:cat,tags:tags,addedBy:currentUser?currentUser.uid:'anonymous'};
db.collection('resources').add(resource).then(function(){
allResources.push(resource);
renderResources(allResources);
closeAddResource();
showToast(t.save_ok);
document.getElementById('resName').value='';document.getElementById('resUrl').value='';document.getElementById('resDesc').value='';document.getElementById('resCat').value='';document.getElementById('resTags').value='';
}).catch(function(err){showToast('Error: '+err.message);});
}

function escapeHtml(text){return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function escapeJs(text){return text.replace(/\/g,'\\').replace(/'/g,"\'").replace(/"/g,'\"');}

document.getElementById('resourceModal').addEventListener('click',function(e){if(e.target===this)closeAddResource();});
applyLang();
loadResources();

// Auth overlay safety timeout

document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){document.getElementById('resourceModal').classList.remove('show');}
  if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();document.getElementById('searchInput').focus();}
});
</script>
<script>setTimeout(function(){var o=document.getElementById("authOverlay");if(o){o.classList.add("done");setTimeout(function(){o.remove();},600);}},1500);</script>
</body>
</html>
