<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBELISK</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #000;
            color: #e0e0e5;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        #splash {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 1s ease, visibility 1s;
        }

        #splash.done {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        #splash video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        .skip {
            position: absolute;
            bottom: 40px;
            right: 40px;
            padding: 10px 28px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: rgba(255,255,255,0.6);
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            cursor: pointer;
            opacity: 0;
            animation: fadeIn 1s ease 2s forwards;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }

        .skip:hover {
            background: rgba(255,255,255,0.15);
            color: #fff;
            border-color: rgba(255,255,255,0.4);
        }

        #main {
            opacity: 0;
            transition: opacity 1.2s ease;
            display: none;
            height: 100vh;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            position: relative;
        }

        #main.visible {
            opacity: 1;
            display: flex;
        }

        #main::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 50% 30%, rgba(255,255,255,0.02) 0%, transparent 60%);
            pointer-events: none;
        }

        .main-text {
            position: relative;
            z-index: 1;
        }

        .main-text h2 {
            font-size: clamp(1.6rem, 4vw, 2.6rem);
            font-weight: 300;
            letter-spacing: 0.15em;
            margin-bottom: 24px;
            background: linear-gradient(180deg, #fff, rgba(255,255,255,0.5));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .main-text p {
            max-width: 480px;
            color: #555560;
            font-size: 0.95rem;
            font-weight: 300;
            line-height: 2;
            letter-spacing: 0.05em;
        }

        .main-footer {
            position: absolute;
            bottom: 40px;
            font-size: 0.65rem;
            color: rgba(255,255,255,0.1);
            letter-spacing: 0.2em;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        @media (max-width: 480px) {
            .skip {
                bottom: 24px;
                right: 24px;
                padding: 8px 20px;
            }
        }
    </style>
</head>
<body>

    <div id="splash">
        <video id="video" autoplay muted playsinline disablePictureInPicture disableRemotePlayback>
            <source src="splash.mp4" type="video/mp4">
        </video>
        <button class="skip" onclick="enterSite()">Skip</button>
    </div>

    <div id="main">
        <div class="main-text">
            <h2>透视应用的棱镜</h2>
            <p>
                在二进制与权限的缝隙之间，<br>
                打捞被隐匿的数据流向。<br>
                此处不陈列功能，只保留锋芒。
            </p>
        </div>
        <div class="main-footer">OBELISK · 2026</div>
    </div>

    <script>
        var video = document.getElementById('video');
        var splash = document.getElementById('splash');
        var main = document.getElementById('main');

        video.addEventListener('ended', function() {
            enterSite();
        });

        function enterSite() {
            splash.classList.add('done');
            video.pause();
            setTimeout(function() {
                main.style.display = 'flex';
                void main.offsetWidth;
                main.classList.add('visible');
                document.body.style.overflow = 'auto';
            }, 500);
        }

        splash.addEventListener('click', function(e) {
            if (e.target.tagName !== 'BUTTON') {
                enterSite();
            }
        });
    </script>

</body>
</html>
