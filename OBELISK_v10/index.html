<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="OBELISK - 极简极客资源整合与社交平台" />
    <meta name="theme-color" content="#f5f5f5" />
    <title>OBELISK</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231a1a1a'/%3E%3Ctext x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' font-family='JetBrains Mono, monospace' font-size='18' font-weight='700' fill='white'%3EO%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#f5f5f5;padding:24px;">
        <div style="max-width:480px;text-align:center;font-family:Inter,system-ui,sans-serif;">
          <div style="font-size:40px;letter-spacing:0.3em;font-weight:300;margin-bottom:16px;">OBELISK</div>
          <div style="height:1px;width:96px;background:rgba(0,0,0,0.2);margin:0 auto 24px;"></div>
          <p style="color:#666;line-height:1.7;">本站需要 JavaScript 才能正常运行。请在浏览器设置中启用 JavaScript 后刷新页面。</p>
        </div>
      </div>
    </noscript>
    <script>
      (function () {
        var stored = sessionStorage.getItem('spa-redirect-path');
        if (stored && window.location.hash === '') {
          sessionStorage.removeItem('spa-redirect-path');
          history.replaceState(null, '', stored);
        } else if (stored && window.location.hash.startsWith('#')) {
          sessionStorage.removeItem('spa-redirect-path');
          var target = window.location.hash.slice(1);
          history.replaceState(null, '', target);
        }
      })();
    </script>
    <script>
      (function () {
        var root = document.getElementById('root');
        var shown = false;

        function show(reason) {
          if (shown || root.childElementCount > 0) return;
          shown = true;
          root.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Inter,system-ui,sans-serif;background:#f5f5f5;">' +
            '<div style="max-width:520px;">' +
            '<div style="font-size:32px;letter-spacing:0.3em;font-weight:300;margin-bottom:16px;">OBELISK</div>' +
            '<div style="height:1px;width:96px;background:rgba(0,0,0,0.2);margin-bottom:24px;"></div>' +
            '<p style="color:#666;line-height:1.7;">页面资源加载失败，应用未能启动。请检查部署的构建产物目录（应为 <code>dist</code>）与 base path 配置。</p>' +
            '<pre style="margin-top:16px;padding:12px;background:rgba(0,0,0,0.05);border-radius:4px;font-size:12px;color:#444;white-space:pre-wrap;word-break:break-all;">' +
            String(reason).replace(/[<>&]/g, '') +
            '</pre></div></div>';
        }

        window.addEventListener('error', function (e) {
          var target = e.target;
          if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
            show('无法加载资源：' + (target.src || target.href));
          } else if (e.message) {
            show(e.message);
          }
        }, true);

        window.setTimeout(function () {
          show('应用在 15 秒内没有渲染任何内容，请打开 F12 控制台查看详细报错。');
        }, 15000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
