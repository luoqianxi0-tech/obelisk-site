<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>Redirecting…</title>
  <script>
    (function () {
      var path = window.location.pathname + window.location.search + window.location.hash;
      var base = document.querySelector('meta[name="base-path"]');
      var basePath = base ? base.content : '/';
      if (basePath.endsWith('/')) basePath = basePath.slice(0, -1);
      var cleaned = path;
      if (cleaned.indexOf(basePath) === 0) cleaned = cleaned.slice(basePath.length);
      if (!cleaned.startsWith('/')) cleaned = '/' + cleaned;
      sessionStorage.setItem('spa-redirect-path', cleaned);
      window.location.replace(basePath + '/#' + cleaned);
    })();
  </script>
</head>
<body>
  <noscript>
    <meta http-equiv="refresh" content="0; url=/" />
  </noscript>
</body>
</html>
